# Publica o protótipo de telas (Requisitos/prototipo/) no GitHub Pages (RF-WEB; desvio de ferramenta
# declarado no README: protótipo HTML próprio em vez de Figma).
name: pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Requisitos/prototipo
      - id: deployment
        uses: actions/deploy-pages@v4
