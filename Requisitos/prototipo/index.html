<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
:root{--bg:#f6f8f8;--card:#fff;--bd:#dde4e2;--tx:#1a1d21;--mut:#5b6663;--pri:#17716a;--on-pri:#fff;--soft:#e8f7f4;--deep:#115a55;

:root[data-theme="dark"]{--bg:#1a1f1e;--card:#242a29;--bd:#354040;--tx:#e8ecea;--mut:#a3b0ac;--pri:#4cb9aa;--on-pri:#0b2a27;--soft:#1f3532;--deep:#9fdcd2;--b:#e8ecea;--d:#f08a7e;--t:#7ab3f0;--l:#6fcf8e;--gb:#2f3836;--gf:#a3b0ac;--ab:#3a3018;--af:#f2c14e;--tb:#1f3532;--tf:#72cabd;--vb:#1d3326;--vf:#6fcf8e;--rb:#3d2320;--rf:#f08a7e;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Inter,system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}.b{color:var(--b)}.d{color:var(--d)}.t{color:var(--t)}.l{color:var(--l)}

.top span{color:var(--mut);font-size:13px;flex:1;min-width:180px}

.side{background:var(--card);border-right:1px solid var(--bd);padding:16px 12px}
.logo{font-family:Pacifico,cursive;color:var(--pri);font-size:24px;margin:0 8px 14px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--mut);text-decoration:none;border-left:3px solid transparent;margin-bottom:2px}

.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.bt.pri{background:var(--pri);color:var(--on-pri);border-color:transparent}.bt.danger{color:var(--d);border-color:var(--d)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--t);outline-offset:2px}

.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.fl input{flex:1;min-width:160px}
.tw{padding:0;overflow:visible}.tw thead th:first-child{border-top-left-radius:12px}.tw thead th:last-child{border-top-right-radius:12px}
.sp{position:relative;display:inline-flex}.sp .bt{padding:5px 10px;font-size:13px}.sp>.bt:first-child{border-radius:8px 0 0 8px}.sp>.cv{border-radius:0 8px 8px 0;border-left-width:0;padding:5px 7px}.sp>.pri+.cv,.sp>.cv.pri{border-left:1px solid rgba(255,255,255,.4)}
.cv svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mn{position:absolute;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--bd);border-radius:10px;min-width:200px;z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.18)}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}.sec a{color:var(--deep);font-size:14px}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.fd{margin-bottom:12px}.fd label,.fd legend{display:block;font-weight:500;font-size:14px;margin-bottom:4px}.fd input,.fd select{width:100%}
.fd.err input{border-color:var(--d)}.msg{color:var(--d);font-size:13px;margin-top:4px;display:flex;gap:6px;align-items:center}.hint{color:var(--mut);font-size:13px;margin-top:4px}
.seg label{display:inline-flex;gap:6px;margin-right:16px;font-weight:400}.seg input{width:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--mut);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}.tabs a.on{color:var(--deep);border-color:var(--pri);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}.kv dt{color:var(--mut)}.kv dd{margin:0}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;color:var(--mut);cursor:pointer;white-space:nowrap}.tabs button.on{color:var(--deep);border-color:var(--pri);font-weight:600}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:8px}.lgd i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sb{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:5px;align-items:center}.sb:hover{color:var(--tx)}th[aria-sort=ascending],th[aria-sort=descending]{color:var(--tx)}.sa{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.sa path{opacity:.4}th[aria-sort=ascending] .sa .u,th[aria-sort=descending] .sa .dw{opacity:1}
.srt{display:none;padding:10px 14px;border-bottom:1px solid var(--bd)}.srt label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut)}.srt select{flex:1}
select:disabled,.bt:disabled{opacity:.55;cursor:not-allowed}.acts select{padding:5px 8px;font-size:13px;max-width:190px}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;color:var(--deep);font-size:14px;margin-bottom:12px}
.dn{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.dn svg{width:150px;height:150px;flex:none}.lg{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;flex:1;min-width:150px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}.lg span{color:var(--mut)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);max-width:420px;padding:20px}dialog::backdrop{background:rgba(0,0,0,.45)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pri);color:var(--on-pri);padding:10px 16px;border-radius:8px;display:none;z-index:5}
@media (max-width:700px){.srt{display:block}.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--bd);padding:8px}.logo{display:none}
.nav{display:flex;gap:4px;overflow-x:auto}.nav a{border-left:0;border-bottom:3px solid transparent;white-space:nowrap}.nav a.on{border-bottom-color:var(--pri)}
main{padding:14px}thead{display:none}table,tbody,tr,td{display:block}tr{padding:10px 14px;border-top:1px solid var(--bd)}tr:first-child{border-top:0}
td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}td::before{content:attr(data-l);color:var(--mut);font-size:13px;text-align:left}}
.pt{cursor:pointer;stroke:transparent;stroke-width:12px;transition:r .12s}.pt:hover,.pt:focus-visible{r:5.5}
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:nowrap}#tip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sh .logo{margin:0 0 0 8px}
.cl{display:flex;align-items:center;justify-content:center;flex:none;width:32px;height:32px;background:none;border:1px solid var(--bd);border-radius:8px;color:var(--mut);cursor:pointer}.cl:hover{color:var(--tx);background:var(--bg)}.cl svg{transition:transform .2s}
.app{transition:grid-template-columns .2s}
@media (min-width:981px){.app.mini{grid-template-columns:64px 1fr}.app.mini .side{padding:12px 8px}.app.mini .sh{flex-direction:column;gap:10px}.app.mini .logo{font-size:0;margin:0}.app.mini .logo::first-letter{font-size:26px}.app.mini .cl svg{transform:rotate(180deg)}.app.mini .nav a{justify-content:center;padding:11px 0}.app.mini .nav .lb{display:none}}
@media (max-width:980px){.cl{display:none}.sh{margin-bottom:10px}}
@media (max-width:700px){.sh{display:none}}
@media (max-width:980px) and (min-width:701px){
.app{grid-template-columns:64px 1fr}.side{padding:12px 8px}.logo{font-size:0;margin:0 0 10px;text-align:center}.logo::first-letter{font-size:26px}
.nav a{justify-content:center;padding:11px 0}.nav .lb{display:none}main{padding:16px}}
@media (max-width:700px){
.top{padding:8px 12px}.top span{display:none}.top select{flex:1}
.side{position:fixed;left:0;right:0;bottom:0;z-index:4;border:0;border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.nav a{flex:1 0 66px;flex-direction:column;justify-content:center;gap:2px;font-size:11px;padding:6px 4px;border:0;border-top:3px solid transparent;border-radius:6px;margin:0;white-space:nowrap}.nav a.on{border-top-color:var(--pri)}
main{padding:14px 14px calc(84px + env(safe-area-inset-bottom,0px))}h2{font-size:20px}
.grid{grid-template-columns:repeat(2,1fr);gap:8px}.grid .card{padding:12px}.val,.kpi .val{font-size:20px}
.fl>*{flex:1 1 100%}.two{grid-template-columns:1fr}.dn svg{width:130px;height:130px}.ph .acts{width:100%}
.bt,input,select{min-height:40px}.sp .bt{min-height:36px}.mn{min-width:180px}
dialog{width:calc(100% - 32px)}#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 24px)}td{overflow-wrap:anywhere}}
</style>
</head>
<body>
<div class="top">
  <label for="role">Ver como</label>
  <select id="role"><option value="ADM">Administrador</option><option value="FIN" selected>Financeiro</option><option value="MOT">Motorista</option><option value="CLI">Cliente</option></select>
  <span>Protótipo: dados fictícios; os controles seguem a matriz de permissões.</span>
  <button class="bt" id="tema" type="button">Claro/escuro</button>
</div>
<div class="app" id="app"><aside class="side"><div class="sh"><p class="logo">Cooperativa</p><button type="button" class="cl" id="col" aria-controls="nav" aria-expanded="true" aria-label="Recolher menu" title="Recolher menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button></div><nav class="nav" id="nav" aria-label="Menu principal"></nav></aside><main id="v"></main></div>
<dialog id="dlg"><h3 id="dt">Confirmar ação</h3><p id="dm"></p><div class="acts" style="justify-content:flex-end"><button class="bt" onclick="dlg.close()">Voltar</button><button class="bt pri" id="dok">Confirmar</button></div></dialog>
<div id="tip" role="tooltip" hidden></div>
<div id="toast" role="status"></div>
<script>
const I={home:"M4 11l8-7 8 7v9H4z",doc:"M7 3h7l4 4v14H7zM14 3v4h4",coin:"M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v10M9.5 9.5h4a1.5 1.5 0 010 3h-3a1.5 1.5 0 000 3h4",down:"M7 7l10 10M17 8v9H8",chart:"M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3",users:"M9 11a3 3 0 100-6 3 3 0 000 6zM3 20c0-3 3-5 6-5s6 2 6 5M17 8a2.5 2.5 0 010 5M21 19c0-2-1.5-3.5-4-4",user:"M12 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM5 20c0-4 3.5-6 7-6s7 2 7 6",brief:"M4 8h16v11H4zM9 8V5h6v3",plus:"M12 5v14M5 12h14",check:"M5 12l5 5L20 7",check2:"M2 12l5 5L17 7M12 16l1 1L22 7",x:"M6 6l12 12M18 6L6 18",alert:"M12 4l9 16H3zM12 10v4M12 17.5v.01",hour:"M6 3h12M6 21h12M7 3c0 6 10 6 10 18M17 3c0 12-10 12-10 18",play:"M8 5l11 7-11 7z",ban:"M12 3a9 9 0 100 18 9 9 0 000-18zM5.6 5.6l12.8 12.8",pen:"M4 20l4-1 11-11-3-3L5 16z",cash:"M3 6h18v12H3zM12 9.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5z",pct:"M19 5L5 19M7 5a2 2 0 100 4 2 2 0 000-4zM17 15a2 2 0 100 4 2 2 0 000-4z",wallet:"M3 7a2 2 0 012-2h13v4M3 7v10a2 2 0 002 2h14V9H5a2 2 0 01-2-2z"};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${I[n]}"/></svg>`;
const R=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const S={RASCUNHO:["gray","pen","Rascunho"],PENDENTE:["amb","hour","Pendente de aprovação"],ATIVO:["teal","play","Ativo"],ENCERRADO:["verde","check2","Encerrado"],CANCELADO:["gray canc","ban","Cancelado"],PREVISTO:["gray","hour","Previsto"],PAGO:["teal","check","Pago"],REPASSADO:["verde","check2","Repassado"],ATRASO:["red","alert","Em atraso"],INATIVO:["gray","ban","Inativo"]};
const bd=k=>`<span class="badge ${S[k][0]}">${ic(S[k][1])}${S[k][2]}</span>`;
const m=(c,v)=>`<span class="num ${c}">${R(v)}</span>`;
const q=id=>document.getElementById(id);
const NAV=[["painel","Painel","home","ADM FIN MOT CLI"],["usuarios","Usuários","users","ADM"],["cooperandos","Cooperandos","user","ADM FIN"],["clientes","Clientes","brief","ADM FIN MOT"],["contratos","Contratos","doc","ADM FIN MOT CLI"],["pagamentos","Pagamentos","coin","ADM FIN MOT CLI"],["despesas","Despesas","down","ADM FIN MOT"],["relatorios","Relatórios","chart","ADM FIN MOT"]];
const GRP={"cooperando-novo":"cooperandos","contrato":"contratos","contrato-novo":"contratos","despesa-nova":"despesas"};
const ME={MOT:"Carlos Mendes",CLI:"Transportes Alvorada"};
let role="FIN",cur=148;
const C=[{id:148,cli:"Transportes Alvorada",co:"Carlos Mendes",d:"Transporte de insumos, rota Lavras–BH",tot:6000,n:3,tx:"10%",st:"ATIVO"},{id:131,cli:"Distribuidora Serra",co:"Carlos Mendes",d:"Entregas semanais na região",tot:5700,n:6,tx:"R$ 50,00 fixo",st:"ATIVO"},{id:152,cli:"Transportes Alvorada",co:"Joana Reis",d:"Mudança de maquinário",tot:4000,n:1,tx:"12%",st:"PENDENTE"},{id:155,cli:"Mercado Boa Terra",co:"Carlos Mendes",d:"Abastecimento mensal de loja",tot:3000,n:2,tx:"8%",st:"RASCUNHO"},{id:120,cli:"Distribuidora Serra",co:"Joana Reis",d:"Frete único para Divinópolis",tot:2400,n:1,tx:"10%",st:"ENCERRADO"}];
const P=[{c:148,p:"2/3",v:"12/11/2026",b:2000,x:200,s:"PREVISTO"},{c:148,p:"1/3",v:"12/10/2026",b:2000,x:200,s:"PAGO"},{c:131,p:"5/6",v:"28/10/2026",b:950,x:50,s:"ATRASO"},{c:131,p:"4/6",v:"28/09/2026",b:950,x:50,s:"REPASSADO"},{c:120,p:"1/1",v:"10/09/2026",b:2400,x:240,s:"REPASSADO"}];
const D=[{o:"Cooperativa",co:"—",k:"Administrativa",d:"Aluguel da sede",v:1800,dt:"05/11/2026"},{o:"Cooperando",co:"Carlos Mendes",k:"Combustível",d:"Abastecimento rota BH",v:340,dt:"03/11/2026"},{o:"Cooperando",co:"Joana Reis",k:"Manutenção",d:"Troca de pneus",v:920,dt:"29/10/2026"},{o:"Cooperando",co:"Carlos Mendes",k:"Pedágio",d:"Pedágios do mês",v:86,dt:"28/10/2026"}];
const own=()=>C.filter(c=>role=="MOT"?c.co==ME.MOT:role=="CLI"?c.cli==ME.CLI:1);
const ids=()=>own().map(c=>c.id);
let TID=0;
const tb=(cols,rows)=>{const id="t"+(TID++);return `<div class="card tw" id="${id}"><div class="srt"><label>Ordenar por<select onchange="srt('${id}',this.value)"><option value="">Escolha uma coluna</option>${cols.map((c,i)=>c=="Ações"?"":`<option value="${i}:1">${c} (crescente)</option><option value="${i}:-1">${c} (decrescente)</option>`).join("")}</select></label></div><table><thead><tr>${cols.map((c,i)=>c=="Ações"?`<th>${c}</th>`:`<th aria-sort="none"><button type="button" class="sb" onclick="srt('${id}',${i})">${c}<svg class="sa" viewBox="0 0 24 24" aria-hidden="true"><path class="u" d="M8 19V5M4.5 8.5L8 5l3.5 3.5"/><path class="dw" d="M16 5v14M12.5 15.5L16 19l3.5-3.5"/></svg></button></th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td data-l="${cols[i]}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`};
const pg=(t,s,a="")=>`<div class="ph"><div><h2>${t}</h2>${s?`<p class="sub">${s}</p>`:""}</div><div class="acts">${a}</div></div>`;
const lk=(h,t,k="",i="")=>`<a class="bt ${k}" href="#${h}">${i?ic(i):""}${t}</a>`;
const fl=(...x)=>`<div class="fl">${x.join("")}</div>`;
const inp=p=>`<input placeholder="${p}" aria-label="${p}">`;
const sel=(l,o)=>`<select aria-label="${l}"><option>${l}: todos</option>${o.map(x=>`<option>${x}</option>`).join("")}</select>`;
const fd=(l,h,id,x="")=>`<div class="fd" id="f-${id}"><label for="${id}">${l}</label>${h}${x}</div>`;
const tx=(id,p="",t="text",v="")=>`<input id="${id}" type="${t}" placeholder="${p}" value="${v}">`;
